name: CI

on:
  push:
  pull_request:

jobs:
  php:
    runs-on: ubuntu-latest
    container: php:8.1-cli
    steps:
      - uses: actions/checkout@v4
      - name: Lint plugin PHP
        run: for file in plugin/*.php plugin/includes/*.php; do php -l "$file" || exit 1; done
      - name: Test protocol boundary
        run: php tests/protocol.php
      - name: Verify direct-access guards
        run: |
          for file in plugin/*.php plugin/includes/*.php; do
            output=$(php -r 'include $argv[1]; echo "loaded";' "$file")
            test -z "$output" || { echo "Direct access loaded $file"; exit 1; }
          done

  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test bridge
        run: node --test tests/bridge.test.mjs

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test disposable WordPress integration
        run: python3 tests/integration-docker.py
