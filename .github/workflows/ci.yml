name: CI

on:
  push:
  pull_request:

jobs:
  php:
    runs-on: ubuntu-latest
    container: php:8.1-cli
    steps:
      - uses: actions/checkout@v4
      - name: Lint plugin PHP
        run: for file in plugin/*.php plugin/includes/*.php; do php -l "$file" || exit 1; done
      - name: Test NexPilot behavior
        run: php tests/run.php

  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test bridge
        run: node --test tests/bridge.test.mjs

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PHP CLI
        run: sudo apt-get update && sudo apt-get install -y php-cli
      - name: Build plugin ZIP
        run: python3 build.py
      - name: Check package contents
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          archive = next(Path('dist').glob('nexdev-site-connector-*.zip'))
          with ZipFile(archive) as package:
              names = package.namelist()
          if not names or not all(name.startswith('nexdev-site-connector/') for name in names):
              raise SystemExit('Unexpected installer layout')
          if 'nexdev-site-connector/nexdev-site-connector.php' not in names:
              raise SystemExit('Plugin entry point missing')
          if any('/tests/' in name or '/.runtime/' in name for name in names):
              raise SystemExit('Test or runtime data in installer')
          PY
