name: Package approved release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing, reviewed release tag (for example v0.2.1-beta.1)
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PHP CLI
        run: sudo apt-get update && sudo apt-get install -y php-cli
      - name: Verify tag and release notes
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re
          tag = os.environ['RELEASE_TAG']
          header = Path('plugin/nexdev-site-connector.php').read_text()
          match = re.search(r'\* Version: ([0-9A-Za-z.-]+)', header)
          if not match or tag != 'v' + match.group(1):
              raise SystemExit('Release tag and plugin header differ')
          if f'Stable tag: {match.group(1)}' not in Path('plugin/readme.txt').read_text():
              raise SystemExit('Plugin readme version differs')
          if not Path(f'docs/releases/{tag}.md').is_file():
              raise SystemExit('Release notes are missing')
          PY
          test "$(git describe --tags --exact-match)" = "$RELEASE_TAG"
      - name: Verify behavior and bridge
        run: |
          php tests/run.php
          node --test tests/bridge.test.mjs
      - name: Build installer and bridge assets
        run: |
          python3 build.py
          cp bridge/nexdev-mcp.mjs dist/nexdev-mcp.mjs
          cd dist
          sha256sum nexdev-mcp.mjs > nexdev-mcp.mjs.sha256
      - name: Inspect installer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          archive = next(Path('dist').glob('nexdev-site-connector-*.zip'))
          with ZipFile(archive) as package:
              names = package.namelist()
          if not names or not all(name.startswith('nexdev-site-connector/') for name in names):
              raise SystemExit('Unexpected installer layout')
          if 'nexdev-site-connector/nexdev-site-connector.php' not in names:
              raise SystemExit('Plugin entry point missing')
          if any('/tests/' in name or '/.runtime/' in name for name in names):
              raise SystemExit('Private or test data in installer')
          PY
      - name: Publish reviewed assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            dist/nexdev-site-connector-*.zip dist/nexdev-site-connector-*.zip.sha256 \
            dist/nexdev-mcp.mjs dist/nexdev-mcp.mjs.sha256 \
            --verify-tag --prerelease \
            --title "NexPilot $RELEASE_TAG" \
            --notes-file "docs/releases/$RELEASE_TAG.md"
